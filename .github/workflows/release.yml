name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build & sign installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tauri build --bundles nsis
        # Note: --bundles nsis is needed so we don't accidentally produce a
        # .deb/.rpm/.dmg on Linux. Tauri still emits the update manifest
        # in src-tauri/target/release/bundle/nsis/ next to the .exe.

      - name: Locate installers
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          EXE=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -n1)
          SIG=$(ls src-tauri/target/release/bundle/nsis/*.sig | head -n1)
          echo "exe=${EXE}" >> "$GITHUB_OUTPUT"
          echo "sig=${SIG}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "Installer: ${EXE}"
          echo "Signature: ${SIG}"

      - name: Build latest.json manifest
        # Tauri 2.5.x emits only the .sig next to the installer when
        # `bundle.createUpdaterArtifacts: true` is set, not the full
        # manifest. We build it ourselves from the .sig so the
        # tauri-plugin-updater client can verify and download the
        # update. Shape follows the v2 manifest contract.
        shell: bash
        run: |
          set -euo pipefail
          EXE_REL="${{ steps.locate.outputs.exe }}"
          SIG_REL="${{ steps.locate.outputs.sig }}"
          VERSION="${{ steps.locate.outputs.version }}"
          ASSET_NAME=$(basename "$EXE_REL")
          # Signature file is base64-encoded; the .sig file IS the base64.
          SIGNATURE=$(cat "$SIG_REL" | tr -d '\n\r[:space:]')
          # ISO 8601 timestamp in UTC.
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${ASSET_NAME}"
          cat > src-tauri/target/release/bundle/nsis/latest.json <<EOF
          {
            "version": "${VERSION}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${SIGNATURE}",
                "url": "${URL}"
              }
            }
          }
          EOF
          echo "Wrote latest.json:"
          cat src-tauri/target/release/bundle/nsis/latest.json

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Project M ${{ github.ref_name }}'
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.locate.outputs.exe }}
            ${{ steps.locate.outputs.sig }}
            src-tauri/target/release/bundle/nsis/latest.json